# Weryfikacja sumy SHA-256 każdego obrazu z sw-description
CONFIG_HASH_VERIFY=y
# Bez serwera WWW: aktualizacje tylko z wiersza poleceń (mniej otwartych usług)
# CONFIG_WEBSERVER is not set
# CONFIG_MONGOOSE is not set

# Handler wykonujący sekcję bootenv z sw-description (slot, upgrade_available, bootcount)
CONFIG_BOOTLOADERHANDLER=y

# Podpisany manifest (CMS / PKCS#7), weryfikowany certyfikatem z obrazu
CONFIG_SIGNED_IMAGES=y
CONFIG_SIGALG_CMS=y
