#@TYPE: Machine
#@NAME: IoT QEMU ARM64 secure boot (UEFI)
#@DESCRIPTION: qemuarm64-secureboot z meta-arm (TF-A, OP-TEE, U-Boot), ale kernel
#@             uruchamiany przez UEFI (systemd-boot), aby U-Boot mierzył go w TPM
#@             (measured boot) i przekazywał dziennik zdarzeń do Linuksa.

require conf/machine/qemuarm64-secureboot.conf

# przepisy przypisane do qemuarm64-secureboot (TF-A, OP-TEE, U-Boot) mają działać
# także dla tej maszyny
MACHINEOVERRIDES =. "qemuarm64-secureboot:"

# start przez UEFI: U-Boot -> systemd-boot -> kernel
MACHINE_FEATURES:append = " efi"
EFI_PROVIDER = "systemd-boot"
EXTRA_IMAGEDEPENDS:append = " systemd-boot"

# dysk: partycja EFI (systemd-boot + kernel) i partycja systemowa
WKS_FILE = "iot-qemuarm64-efi.wks"
