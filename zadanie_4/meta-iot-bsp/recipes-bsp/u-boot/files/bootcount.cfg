# Licznik startów w zmiennych U-Boota (A/B + automatyczny rollback)
CONFIG_BOOTCOUNT_LIMIT=y
CONFIG_BOOTCOUNT_ENV=y

# Domyślny limit i przełączenie slotu po jego przekroczeniu
CONFIG_BOOTCOUNT_BOOTLIMIT=3
CONFIG_BOOTCOUNT_ALTBOOTCMD="if test ${slot} = A; then setenv slot B; else setenv slot A; fi; setenv upgrade_available 0; setenv bootcount 0; saveenv; run bootcmd"

# Czas na przerwanie startu (konsola U-Boota)
CONFIG_BOOTDELAY=3

# Zmienne w plikach na partycji FAT (jak na Raspberry Pi), a nie we flashu:
# zapis do emulowanego flasha z Linuksa blokował sterownik CFI w QEMU
# CONFIG_ENV_IS_IN_FLASH is not set
CONFIG_ENV_IS_IN_FAT=y
CONFIG_ENV_FAT_INTERFACE="virtio"
CONFIG_ENV_FAT_DEVICE_AND_PART="0:1"
CONFIG_ENV_FAT_FILE="uboot.env"
CONFIG_ENV_SIZE=0x4000

# Dwie kopie: przerwany zapis nie niszczy obu
CONFIG_ENV_REDUNDANT=y
CONFIG_ENV_FAT_FILE_REDUND="uboot-redund.env"

# Start deterministyczny: zawsze boot.scr z partycji 1 (A/B), bez skanowania dysków
# CONFIG_BOOTSTD_BOOTCOMMAND is not set
CONFIG_USE_BOOTCOMMAND=y
CONFIG_BOOTCOMMAND="load virtio 0:1 ${scriptaddr} boot.scr && source ${scriptaddr}"
