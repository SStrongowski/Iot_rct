# Układ TPM 2.0 podłączony przez interfejs TIS w przestrzeni adresowej (MMIO).
# W QEMU: urządzenie tpm-tis-device, w device tree: compatible = "tcg,tpm-tis-mmio".
# Wbudowane (=y), żeby TPM był dostępny od razu przy starcie, bez ładowania modułów.
CONFIG_TCG_TPM=y
CONFIG_TCG_TIS_CORE=y
CONFIG_TCG_TIS=y
CONFIG_HW_RANDOM_TPM=y
