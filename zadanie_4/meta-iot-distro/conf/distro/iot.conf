# Dystrybucja projektu IoT: polityka systemu.
# Punkt wyjścia: Poky z systemd (poky-altcfg). Tu dokładamy własne decyzje.
require conf/distro/poky-altcfg.conf

DISTRO = "iot"
DISTRO_NAME = "IoT Secure Linux"
DISTRO_VERSION = "0.1"

# TPM 2.0: sterowniki w kernelu (meta-tpm) oraz systemd z cryptsetup i TPM2
# (podstawa pod systemd-cryptenroll w zadaniu 5)
DISTRO_FEATURES:append = " tpm2"
