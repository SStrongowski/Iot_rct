# mosquitto.conf — broker MQTT z wzajemnym uwierzytelnianiem TLS (zadanie 7)
# Uruchomienie: mosquitto -c mosquitto.conf -v
per_listener_settings true

listener 8883 0.0.0.0
# certyfikat i klucz brokera, CA do weryfikacji klientów, lista odwołań
cafile   /home/work/iot-ca/ca.crt
certfile /home/work/iot-ca/servers/mosquitto.crt
keyfile  /home/work/iot-ca/servers/mosquitto.key
crlfile  /home/work/iot-ca/crl.pem
# klient MUSI przedstawić certyfikat podpisany przez nasze CA
require_certificate true
# nazwa użytkownika = CN z certyfikatu (iot-<id>); brak haseł
use_identity_as_username true
allow_anonymous false
# każde urządzenie publikuje tylko w swojej gałęzi tematów
acl_file /home/work/Iot_rct/zadanie_7/services/mosquitto.acl
